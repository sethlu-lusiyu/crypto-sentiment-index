name: Hourly Sentiment Update

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline unit tests (hard gate)
        run: python -m pytest tests/test_attribution.py tests/test_purity.py -q

      - name: Run LLM acceptance test (non-blocking signal)
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m pytest tests/test_scope_market.py -q

      - name: Restore SQLite DB cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/sentiment.db*
          key: sentiment-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sentiment-db-

      - name: Run pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MODEL_2: ${{ secrets.LLM_MODEL_2 }}
          LLM_MAX_CALLS_PER_RUN: ${{ secrets.LLM_MAX_CALLS_PER_RUN }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m pipeline.hourly_job

      - name: Save SQLite DB cache
        uses: actions/cache@v4
        with:
          path: data/sentiment.db*
          key: sentiment-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit data exports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: hourly update ${{ github.run_id }}"
          file_pattern: "docs/data/** data/index_export/**"
